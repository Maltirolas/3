<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSSIBLE QUIZZ 80085</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8f1e9; color: #1a1a1a; font-family: system-ui, sans-serif; }
        .btn { transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-3px); }
        pre { font-family: monospace; }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Menu Lateral -->
    <div class="w-80 bg-white border-r border-gray-200 p-6 flex flex-col shadow-xl overflow-y-auto">
        <div class="text-3xl font-bold tracking-tight mb-10 text-amber-800">IMPOSSIBLE QUIZZ</div>
        <div id="sidebar" class="space-y-2 flex-1"></div>
        <div class="mt-auto text-xs text-gray-500 border-t pt-6">
            Fui embora às 15h00 de sexta-feira<br>
            Volto: <span class="font-semibold">1 de Junho</span>
        </div>
    </div>

    <!-- Área Principal -->
    <div class="flex-1 flex items-center justify-center p-10">
        <div id="mainContent" class="max-w-2xl w-full text-center"></div>
    </div>

    <script>
        const vacationDays = ["2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22","2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29"];

        const dailyContent = {
            "2026-05-18": { 
                title: "18 de Maio • Nível Iniciante",
                html: `<p class="text-3xl mb-8">Primeiro desafio das férias:</p>
                       <p class="text-2xl">Qual é o número que toda a gente quer ver mas ninguém admite em voz alta?</p>
                       <div class="grid grid-cols-3 gap-4 mt-10">
                           <button onclick="wrong(this)" class="btn py-6 bg-white border-2 border-gray-300 rounded-2xl">69420</button>
                           <button onclick="correct(this)" class="btn py-6 bg-amber-200 border-2 border-amber-400 rounded-2xl font-bold">80085</button>
                           <button onclick="wrong(this)" class="btn py-6 bg-white border-2 border-gray-300 rounded-2xl">42069</button>
                       </div>`
            },
            "2026-05-19": { 
                title: "19 de Maio • Morse Code",
                html: `<p class="text-3xl mb-8">Decifra o código Morse:</p>
                       <p class="text-4xl font-mono tracking-widest mb-8">---.. ----- ----- ---.. ..... </p>
                       <button onclick="this.innerHTML='80085' ; this.style.backgroundColor='#fcd34d'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Decifrar</button>`
            },
            "2026-05-20": { 
                title: "20 de Maio • Binário Challenge",
                html: `<p class="text-3xl mb-8">Converte este binário:</p>
                       <p class="text-3xl font-mono mb-8">10000000 00000000 00000101</p>
                       <button onclick="this.innerHTML='= 80085' ; this.style.backgroundColor='#fcd34d'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Converter</button>`
            },
            "2026-05-21": { 
                title: "21 de Maio • Cifra de César",
                html: `<p class="text-3xl mb-8">Decifra esta mensagem (Cifra de César +3):</p>
                       <p class="text-3xl font-mono mb-8">ERRRBBV</p>
                       <button onclick="this.innerHTML='BOOBS' ; this.style.backgroundColor='#fcd34d'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Decifrar</button>`
            },
            "2026-05-22": { 
                title: "22 de Maio • ASCII Art + Número",
                html: `<pre class="text-5xl leading-none mx-auto mb-8">( . )( . )<br>   (.Y.)<br>  ( . )( . )</pre>
                       <button onclick="this.innerHTML='O número é 80085' ; this.style.backgroundColor='#fcd34d'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Qual é o número desta arte?</button>`
            },
            "2026-05-25": { 
                title: "25 de Maio • Matemática Troll",
                html: `<p class="text-3xl mb-8">Qual é o resultado desta equação?</p>
                       <p class="text-4xl font-mono">69 × 1160 + 69 × 1 - 0 × 999999</p>
                       <button onclick="this.innerHTML='= 80085' ; this.style.fontSize='2.5rem'" class="btn px-16 py-6 bg-amber-200 rounded-2xl text-2xl">Calcular</button>`
            },
            "2026-05-26": { 
                title: "26 de Maio • Pergunta Traiçoeira",
                html: `<p class="text-3xl mb-8">O que é que o chefe mais quer ver quando abre este site?</p>
                       <div class="grid grid-cols-2 gap-6 mt-8">
                           <button onclick="wrong(this)" class="btn py-8 bg-white border-2 border-gray-300 rounded-2xl">Relatório urgente</button>
                           <button onclick="correct(this)" class="btn py-8 bg-amber-200 border-2 border-amber-400 rounded-2xl font-bold">80085</button>
                       </div>`
            },
            "2026-05-27": { 
                title: "27 de Maio • Código Secreto",
                html: `<p class="text-3xl mb-8">Qual é o significado oculto desta sequência?</p>
                       <p class="text-4xl font-mono mb-8">B O O B S</p>
                       <button onclick="this.innerHTML='80085' ; this.style.backgroundColor='#fcd34d'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Revelar Significado</button>`
            },
            "2026-05-28": { 
                title: "28 de Maio • Desafio Final",
                html: `<p class="text-3xl mb-8">Último desafio antes de eu voltar:</p>
                       <p class="text-2xl">Qual é o número que resolve todos os problemas do escritório?</p>
                       <button onclick="correct(this)" class="btn px-16 py-6 bg-amber-200 rounded-2xl text-2xl">80085</button>`
            },
            "2026-05-29": { 
                title: "29 de Maio • Último Dia",
                html: `<p class="text-5xl">Amanhã volto ao escritório...</p>
                       <p class="text-4xl mt-10 text-amber-600">...mas o espírito fica eternamente em 80085 mode</p>`
            }
        };

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function isAfterVacation() {
            const today = new Date();
            const end = new Date("2026-05-29");
            return today > end;
        }

        function generateSidebar() {
            const sidebar = document.getElementById("sidebar");
            const todayDate = new Date();

            sidebar.innerHTML = `<button onclick="showToday()" class="btn w-full text-left px-6 py-4 bg-black text-white rounded-2xl text-lg font-medium shadow-md mb-6">🏠 Hoje</button>`;

            vacationDays.forEach(day => {
                const dayDate = new Date(day);
                if (dayDate <= todayDate) {
                    const btn = document.createElement("button");
                    btn.className = `btn w-full text-left px-6 py-4 bg-white border border-gray-300 rounded-2xl text-lg font-medium shadow-md`;
                    btn.textContent = day.replace(/-/g, '/');
                    btn.onclick = () => showDay(day);
                    sidebar.appendChild(btn);
                }
            });
        }

        function showToday() {
            if (isAfterVacation()) {
                showFinalScreen();
                return;
            }
            const key = getTodayKey();
            showDay(key);
        }

        function showDay(key) {
            const day = dailyContent[key] || dailyContent["2026-05-29"];
            document.getElementById("mainContent").innerHTML = `
                <h1 class="text-5xl font-bold mb-3">${day.title}</h1>
                <p class="text-xl text-gray-600 mb-10">Férias Mode • Impossible Quizz</p>
                ${day.html}
            `;
        }

        function showFinalScreen() {
            document.getElementById("mainContent").innerHTML = `
                <div class="text-center py-20">
                    <div class="text-6xl mb-8">🏁</div>
                    <h1 class="text-5xl font-bold mb-6">Obrigado por Jogar</h1>
                    <p class="text-6xl text-amber-600 mb-8">.l.</p>
                    <p class="text-2xl">Voltei a 1 de Junho.<br>Espero que tenham gostado dos 80085.</p>
                </div>
            `;
        }

        function correct(btn) {
            btn.style.backgroundColor = "#86efac";
            btn.style.color = "#166534";
            btn.innerHTML = "✅ CERTO! É 80085";
        }

        function wrong(btn) {
            btn.style.backgroundColor = "#fda4af";
            btn.innerHTML = "❌ Errado... Tenta novamente";
        }

        function revealBoobs() {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/95 flex items-center justify-center z-50";
            div.innerHTML = `
                <div class="text-center">
                    <div class="text-8xl font-bold text-amber-300 tracking-widest mb-6">80085</div>
                    <div class="text-7xl text-pink-400 mb-12">BOOBS</div>
                    <button onclick="this.parentElement.parentElement.remove()" class="px-12 py-5 bg-white text-black rounded-2xl text-xl font-medium">Fechar</button>
                </div>
            `;
            document.body.appendChild(div);
        }

        window.onload = () => {
            generateSidebar();
            showToday();
        };
    </script>
</body>
</html>
