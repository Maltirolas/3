<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPOSSIBLE QUIZZ 80085</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8f1e9; color: #1a1a1a; font-family: system-ui, sans-serif; }
        .btn { transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-4px); }
        .reveal { animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Menu Lateral -->
    <div class="w-80 bg-white border-r border-gray-200 p-8 flex flex-col shadow-xl">
        <div class="text-3xl font-bold tracking-tight mb-12 text-amber-800">IMPOSSIBLE QUIZZ</div>
        
        <div class="space-y-3">
            <button onclick="showToday()" class="btn w-full text-left px-6 py-4 bg-black text-white rounded-2xl text-lg font-medium shadow-md">🏠 Hoje</button>
            <button onclick="revealBoobs()" class="btn w-full text-left px-6 py-4 bg-amber-100 hover:bg-amber-200 rounded-2xl text-lg font-medium shadow-md">🔥 VER 80085</button>
            <button onclick="showArchive()" class="btn w-full text-left px-6 py-4 bg-white border border-gray-300 rounded-2xl text-lg font-medium shadow-md">📼 Arquivo</button>
        </div>

        <div class="mt-auto text-sm text-gray-500">
            Fui embora às 15h00 de sexta-feira<br>
            Volto: <span class="font-semibold">1 de Junho</span>
        </div>
    </div>

    <!-- Área Principal -->
    <div class="flex-1 flex items-center justify-center p-10">
        <div id="mainContent" class="max-w-2xl w-full text-center"></div>
    </div>

    <script>
        const dailyContent = {
            "2026-05-18": { 
                title: "18 de Maio • Dia 1",
                html: `<img src="https://picsum.photos/id/1015/900/500" class="rounded-3xl shadow-2xl mx-auto"><br>
                       <p class="text-3xl mt-8">Cheguei à praia.<br>Vocês ainda estão no Excel.</p>`
            },
            "2026-05-19": { 
                title: "19 de Maio",
                html: `<div class="text-5xl">28800 ÷ 0.36 + 69</div>
                       <div class="text-7xl text-amber-600 mt-6 font-bold">= 80085</div>`
            },
            "2026-05-20": { 
                title: "20 de Maio • Impossible Quizz",
                html: `<p class="text-3xl mb-8">Pergunta do dia:</p>
                       <p class="text-2xl">Qual é o número que toda a gente quer ver mas ninguém admite?</p>
                       <div class="grid grid-cols-3 gap-4 mt-10 max-w-md mx-auto">
                           <button onclick="wrong(this)" class="btn py-6 bg-white border-2 border-gray-300 rounded-2xl text-xl">69420</button>
                           <button onclick="correct(this)" class="btn py-6 bg-amber-200 border-2 border-amber-400 rounded-2xl text-xl font-bold">80085</button>
                           <button onclick="wrong(this)" class="btn py-6 bg-white border-2 border-gray-300 rounded-2xl text-xl">42069</button>
                       </div>`
            },
            "2026-05-21": { 
                title: "21 de Maio • Impossible Quizz",
                html: `<p class="text-3xl mb-8">Qual é o verdadeiro significado da vida?</p>
                       <div class="space-y-4 mt-10">
                           <button onclick="wrong(this)" class="btn w-full py-5 bg-white border-2 border-gray-300 rounded-2xl text-xl">42</button>
                           <button onclick="wrong(this)" class="btn w-full py-5 bg-white border-2 border-gray-300 rounded-2xl text-xl">Amor</button>
                           <button onclick="correct(this)" class="btn w-full py-5 bg-amber-200 border-2 border-amber-400 rounded-2xl text-xl font-bold">80085</button>
                       </div>`
            },
            "2026-05-22": { 
                title: "22 de Maio • Desafio ASCII",
                html: `<pre class="text-5xl leading-none mx-auto mb-8">( . )( . )<br>  (.Y.)<br>( . )( . )</pre>
                       <button onclick="this.innerHTML='80085 = BOOBS' ; this.classList.add('reveal')" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-2xl">Qual é o número desta arte?</button>`
            },
            "2026-05-25": { 
                title: "25 de Maio • Matemática Avançada",
                html: `<p class="text-3xl mb-8">69 × 1160 + 69 - 0 × 999999 = ?</p>
                       <button onclick="this.innerHTML='80085' ; this.style.fontSize='3rem'" class="btn px-16 py-6 bg-amber-200 rounded-2xl text-2xl">Calcular Resposta</button>`
            },
            "2026-05-26": { 
                title: "26 de Maio • Pergunta Traiçoeira",
                html: `<p class="text-3xl mb-8">O que é que toda a gente no escritório quer ver neste momento?</p>
                       <div class="grid grid-cols-2 gap-6 mt-10 max-w-lg mx-auto">
                           <button onclick="wrong(this)" class="btn py-8 bg-white border-2 border-gray-300 rounded-2xl">Aumento de salário</button>
                           <button onclick="correct(this)" class="btn py-8 bg-amber-200 border-2 border-amber-400 rounded-2xl font-bold">80085</button>
                       </div>`
            },
            "2026-05-27": { 
                title: "27 de Maio • Código Secreto",
                html: `<p class="text-3xl mb-8">Decifra: 8 0 0 8 5</p>
                       <button onclick="this.innerHTML='BOOBS' ; this.style.color='#b45309'" class="btn px-12 py-6 bg-amber-200 rounded-2xl text-3xl">Decifrar</button>`
            },
            "2026-05-28": { 
                title: "28 de Maio • Última Pergunta",
                html: `<p class="text-3xl mb-8">Qual é o KPI mais importante durante as minhas férias?</p>
                       <button onclick="correct(this)" class="btn px-16 py-6 bg-amber-200 rounded-2xl text-2xl">80085</button>`
            },
            "2026-05-29": { 
                title: "29 de Maio • Último Dia",
                html: `<p class="text-4xl">Amanhã volto...</p>
                       <p class="text-5xl mt-10">...mas o espírito fica em 80085 mode</p>`
            }
        };

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function showToday() {
            const key = getTodayKey();
            const day = dailyContent[key] || dailyContent["2026-05-29"];
            
            document.getElementById("mainContent").innerHTML = `
                <h1 class="text-5xl font-bold mb-3">${day.title}</h1>
                <p class="text-xl text-gray-600 mb-10">Férias Mode • Impossible Quizz</p>
                ${day.html}
            `;
        }

        function correct(btn) {
            btn.style.backgroundColor = "#86efac";
            btn.style.color = "#166534";
            btn.innerHTML = "✅ CERTO! 80085";
        }

        function wrong(btn) {
            btn.style.backgroundColor = "#fda4af";
            btn.innerHTML = "❌ Errado... tenta outra vez";
        }

        function revealBoobs() {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/95 flex items-center justify-center z-50";
            div.innerHTML = `
                <div class="text-center">
                    <div class="text-8xl font-bold text-amber-300 tracking-widest mb-6">80085</div>
                    <div class="text-7xl text-pink-400 mb-12">BOOBS</div>
                    <button onclick="this.parentElement.parentElement.remove()" class="px-12 py-5 bg-white text-black rounded-2xl text-xl font-medium">
                        Fechar
                    </button>
                </div>
            `;
            document.body.appendChild(div);
        }

        function showArchive() {
            alert("📼 IMPOSSIBLE QUIZZ ARCHIVE\n\nTodos os caminhos levam ao mesmo número.\n\nVolto a 1 de Junho.");
        }

        window.onload = showToday;
    </script>
</body>
</html>
