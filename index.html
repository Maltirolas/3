<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Férias Mode • Volto a 1 de Junho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #ddd;
            font-family: 'VT323', monospace;
        }
        .title {
            font-size: 2.8rem;
            letter-spacing: 4px;
        }
        .card {
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex">
    <!-- Menu Lateral -->
    <div class="w-72 bg-zinc-950 border-r border-zinc-800 p-6 flex flex-col">
        <div class="text-3xl mb-10 text-red-400">80085 DAYS</div>
        
        <div class="space-y-2 mb-auto">
            <button onclick="showPage('home')" class="w-full text-left px-4 py-3 hover:bg-zinc-900 rounded-lg transition">🏠 Hoje</button>
            <button onclick="showPage('archive')" class="w-full text-left px-4 py-3 hover:bg-zinc-900 rounded-lg transition">📼 Arquivo</button>
            <button onclick="revealBoobs()" class="w-full text-left px-4 py-3 hover:bg-zinc-900 rounded-lg transition text-yellow-300">🔥 VER 80085</button>
        </div>
        
        <div class="text-xs text-zinc-500 mt-auto pt-8">
            Fui embora 15h00 • Sexta-feira<br>
            Volto: 1 de Junho
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-1 p-10">
        <div id="mainContent">
            <!-- Conteúdo dinâmico aqui -->
        </div>
    </div>

    <script>
        const dailyContent = {
            "2026-05-18": { 
                title: "18 de Maio - Dia 1",
                html: `<img src="https://picsum.photos/id/1015/800/450" class="rounded-xl mx-auto shadow-2xl"><br>
                       <p class="text-3xl mt-8">Cheguei à praia. Vocês ainda estão no Excel.</p>`
            },
            "2026-05-19": { 
                title: "19 de Maio",
                html: `<div class="text-5xl">28800 ÷ 0.36 + 69</div>
                       <div class="text-7xl text-yellow-300 mt-6">= 80085</div>
                       <p class="text-2xl mt-8">Sim, ainda estou a gozar com isto.</p>`
            },
            "2026-05-20": { 
                title: "20 de Maio",
                html: `<p class="text-4xl">Deixem a Ana em paz.<br>Deixem-me a mim também.</p>`
            },
            "2026-05-23": { 
                title: "23 de Maio",
                html: `<img src="https://picsum.photos/id/201/800/450" class="rounded-xl mx-auto"><br>
                       <p class="text-3xl mt-6">Aqui o wi-fi é fraco... tal como a minha vontade de responder emails.</p>`
            },
            "2026-05-24": { 
                title: "24 de Maio",
                html: `<div class="text-6xl">Nível de "foda-se" atual:</div>
                       <div class="text-8xl text-orange-400 mt-6">█████░░░░░ 52%</div>`
            },
            "2026-05-25": { 
                title: "25 de Maio",
                html: `<div class="text-6xl">🪦</div>
                       <p class="text-3xl mt-8">Aqui jaz a minha motivação para trabalhar</p>`
            },
            "2026-05-26": { 
                title: "26 de Maio",
                html: `<p class="text-4xl">Se estás a ler isto é porque...</p>
                       <p class="text-5xl mt-8 text-yellow-300">ainda não aceitaste que estou de férias.</p>`
            },
            "2026-05-27": { 
                title: "27 de Maio",
                html: `<div class="text-7xl">( ͡° ͜ʖ ͡°)</div>
                       <p class="text-3xl mt-10">Tu sabes o que isto significa.</p>`
            },
            "2026-05-28": { 
                title: "28 de Maio",
                html: `<p class="text-4xl">Faltam 3 dias úteis...</p>
                       <p class="text-5xl mt-8">para eu voltar a fingir que trabalho.</p>`
            },
            "2026-05-29": { 
                title: "29 de Maio - Último Dia",
                html: `<p class="text-5xl">Amanhã volto.</p>
                       <p class="text-4xl mt-8 text-red-400">Mentalmente ainda estou aqui.</p>`
            }
        };

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function loadDay() {
            const key = getTodayKey();
            const day = dailyContent[key] || dailyContent["2026-05-29"];
            
            document.getElementById("mainContent").innerHTML = `
                <h1 class="text-5xl mb-2">${day.title}</h1>
                <div class="text-xl text-zinc-400 mb-10">Férias Mode Activated</div>
                ${day.html}
            `;
        }

        function revealBoobs() {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/95 flex items-center justify-center z-50";
            div.innerHTML = `
                <div class="text-center">
                    <div class="text-8xl font-bold text-yellow-300 tracking-widest mb-4">80085</div>
                    <div class="text-6xl text-pink-400 mb-12">BOOBS</div>
                    <button onclick="this.parentElement.parentElement.remove()" 
                            class="px-10 py-4 border border-yellow-300 text-yellow-300 hover:bg-yellow-300 hover:text-black transition">
                        FECHAR (ou clica outra vez se quiseres)
                    </button>
                </div>
            `;
            document.body.appendChild(div);
        }

        function showPage(page) {
            if (page === 'archive') {
                alert("📼 ARQUIVO DE FÉRIAS\n\n18 Mai → Cheguei à praia\n19 Mai → 80085\n20 Mai → Deixem a Ana em paz\n...\n\nVolto a 1 de Junho.");
            }
        }

        window.onload = loadDay;
    </script>
</body>
</html>
